<svg xmlns="http://www.w3.org/500/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img" aria-labelledby="title desc">
  <title id="title">Baseline autoencoder experiment pipeline</title>
  <desc id="desc">The diagram shows baseline defaults. Training uses continuous float32 latents and validates every 500 steps, with early stopping and a 5000-step cap. Each new best checkpoint saves original and reconstructed validation image pairs. Review PSNR, SSIM, and these images before manually launching evaluation; insufficient quality means revisiting training. Only evaluation applies quantization and Zstd, using the accepted checkpoint on 100 full-resolution test images. Both scripts log to MLflow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; fill: #172b45; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #475569; }
      .file { font-family: 'DejaVu Sans Mono', monospace; font-size: 17px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .stage { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .output { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.5; }
      .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .helper { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="1050" fill="#ffffff"/>
  <text x="40" y="48" class="title">Baseline experiment: configuration to recorded results</text>
  <text x="40" y="78" class="body">Pipeline prepared. Full baseline training has not started.</text>
  <text x="40" y="102" class="small">Baseline defaults shown. Training uses continuous latents; quantization and Zstd are evaluation steps.</text>

  <!-- Main execution flow. -->
  <path class="flow" d="M 630 225 V 290"/>
  <path class="flow" d="M 630 380 V 440"/>
  <path class="flow" d="M 630 530 V 590"/>
  <path class="flow" d="M 630 685 V 830"/>

  <!-- Shared helpers supply both entry points. -->
  <path class="helper" d="M 370 335 H 430"/>
  <path class="helper" d="M 370 575 C 400 575 395 635 430 635"/>
  <path class="helper" d="M 370 702 C 400 702 400 660 430 660"/>
  <path class="helper" d="M 920 225 C 880 225 880 315 830 315"/>

  <!-- Both stages record their own run in MLflow. -->
  <path class="flow" d="M 830 335 C 880 335 870 440 920 440"/>
  <path class="flow" d="M 830 635 C 875 635 875 525 920 525"/>
  <path class="flow" d="M 1080 570 V 650"/>

  <rect x="430" y="120" width="400" height="105" rx="10" class="stage"/>
  <text x="450" y="148" class="label">Hydra configuration</text>
  <text x="450" y="175" class="file">configs/config.yaml</text>
  <text x="450" y="197" class="small">Used by both training and evaluation</text>
  <text x="450" y="215" class="small">configs/smoke.yaml: verification overrides</text>

  <rect x="430" y="290" width="400" height="90" rx="10" class="stage"/>
  <text x="450" y="320" class="file">train.py</text>
  <text x="450" y="347" class="body">Float32 latent; validate every 500 steps</text>
  <text x="450" y="369" class="small">Early stopping or 5,000-step cap; resume supported</text>

  <rect x="430" y="440" width="400" height="90" rx="10" class="output"/>
  <text x="450" y="470" class="label">Checkpoint + quality review</text>
  <text x="450" y="497" class="file">best.pt / last.pt</text>
  <text x="450" y="519" class="small">Review PSNR, SSIM, and validation image pairs</text>
  <text x="650" y="568" class="small">After quality review</text>

  <rect x="430" y="590" width="400" height="95" rx="10" class="stage"/>
  <text x="450" y="621" class="file">evaluate.py</text>
  <text x="450" y="648" class="body">Same checkpoint; 100 full-resolution images</text>
  <text x="450" y="671" class="small">Quantizer calibration uses training images</text>

  <rect x="450" y="710" width="360" height="95" rx="8" fill="#ffffff"/>
  <text x="630" y="733" text-anchor="middle" class="body">float32 or quantized int8</text>
  <text x="630" y="756" text-anchor="middle" class="body">plain file + Zstd file</text>
  <text x="630" y="779" text-anchor="middle" class="body">restore latent; decode; measure</text>
  <text x="630" y="800" text-anchor="middle" class="small">Zstd must preserve latent bytes exactly</text>

  <rect x="430" y="830" width="400" height="130" rx="10" class="output"/>
  <text x="450" y="860" class="label">Evaluation outputs</text>
  <text x="450" y="888" class="file">per_image.csv / summary.json</text>
  <text x="450" y="912" class="body">200 rows: sizes, bpp, ratios, PSNR, SSIM</text>
  <text x="450" y="934" class="small">quantization.json; plain/compressed latents</text>
  <text x="450" y="952" class="small">Reconstructed PNGs</text>

  <!-- Shared implementation files. -->
  <text x="40" y="270" class="label">Shared by training and evaluation</text>
  <rect x="40" y="290" width="330" height="310" rx="10" class="box"/>
  <text x="60" y="324" class="file">zae/data.py</text>
  <text x="60" y="349" class="body">Load images; fixed splits and hashes</text>
  <text x="60" y="372" class="body">Reproducible training crops</text>
  <path d="M 60 395 H 350" stroke="#e2e8f0"/>
  <text x="60" y="428" class="file">zae/model.py</text>
  <text x="60" y="453" class="body">Residual encoder and decoder</text>
  <path d="M 60 480 H 350" stroke="#e2e8f0"/>
  <text x="60" y="517" class="file">zae/metrics.py</text>
  <text x="60" y="542" class="body">PSNR and SSIM; RGB8 rounding</text>
  <text x="60" y="565" class="body">Input padding for the encoder</text>

  <rect x="40" y="650" width="330" height="105" rx="10" class="box"/>
  <text x="60" y="682" class="file">zae/codec.py</text>
  <text x="60" y="708" class="body">Quantize; serialize; Zstd; restore</text>
  <text x="60" y="732" class="small">File sizes include required metadata</text>

  <!-- Experiment recording. -->
  <rect x="920" y="160" width="320" height="130" rx="10" class="box"/>
  <text x="940" y="190" class="file">zae/early_stopping.py</text>
  <text x="940" y="217" class="body">Stop after 5 checks without a</text>
  <text x="940" y="240" class="body">PSNR gain greater than 0.01 dB</text>
  <text x="940" y="268" class="small">Save and restore patience on resume</text>

  <rect x="920" y="400" width="320" height="170" rx="10" class="stage"/>
  <text x="940" y="433" class="file">zae/tracking.py</text>
  <text x="940" y="462" class="body">Record each run in MLflow</text>
  <text x="940" y="491" class="small">Resolved config, source, environment</text>
  <text x="940" y="515" class="small">Training curves, checkpoints, previews</text>
  <text x="940" y="539" class="small">Evaluation metrics and result files</text>
  <text x="940" y="560" class="small">Evaluation links to its training run</text>

  <rect x="920" y="650" width="320" height="105" rx="10" class="output"/>
  <text x="940" y="682" class="label">MLflow storage</text>
  <text x="940" y="711" class="body">mlflow.db: records and metrics</text>
  <text x="940" y="737" class="body">mlartifacts/: saved files</text>

  <path d="M 40 990 H 1240" stroke="#e2e8f0"/>
  <text x="40" y="1018" class="small">Support: requirements.txt installs dependencies; tests/ verifies behavior; README.md and file-map.md explain usage.</text>
  <text x="40" y="1040" class="small">Solid arrows: main flow and logging. Dotted arrows: helper modules. Generated outputs are excluded from Git.</text>
</svg>
