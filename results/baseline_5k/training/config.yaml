experiment:
  name: div2k_baseline
  description: Residual autoencoder trained with reconstruction loss only
  seed: 0
data:
  root: .
  train_dirs:
  - Datasets/DIV2K_train_HR
  test_dir: Datasets/DIV2K_valid_HR
  expected_train_images: 800
  expected_test_images: 100
  validation_images: 20
  split_seed: 0
  crop_size: 256
  horizontal_flip: true
model:
  name: residual_ae
  hidden_channels: 128
  latent_channels: 64
  downsampling_stages: 4
  negative_slope: 0.2
training:
  batch_size: 16
  max_steps: 5000
  optimizer: adam
  learning_rate: 0.0002
  scheduler: cosine
  warmup_steps: 250
  minimum_learning_rate: 1.0e-06
  gradient_clip: 1.0
  loss: mse
  resume_checkpoint: null
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.01
validation:
  every_steps: 500
  crop_size: 512
  batch_size: 1
  checkpoint_metric: psnr
  checkpoint_mode: max
runtime:
  device: auto
  precision: float32
  num_workers: 4
  cpu_threads: 4
quantization:
  enabled: true
  scheme: uniform_symmetric_per_channel
  dtype: int8
  qmax: 127
  calibration_file: null
  calibration_images: 20
  calibration_crop_size: 256
  calibration_percentile: 99.9
serialization:
  format_version: 1
  float_dtype: float32
  layout: CHW
  byte_order: little
zstd:
  level: 3
  threads: 0
  checksum: true
  dictionary: null
evaluation:
  checkpoint: null
  source_run_id: null
  split: test
  max_images: null
  full_resolution: true
  padding_mode: replicate
  image_rounding: uint8
  png_compress_level: 6
  save_reconstructions: true
  save_latent_files: true
  plot_samples: 3
tracking:
  uri: sqlite:////mnt/data/Zstd-Optimized-Autoencoder/mlflow.db
  artifact_location: null
  experiment_name: zstd_autoencoder
  log_every_steps: 100
  system_metrics: true
  plots: true
  reconstruction_samples: 3
