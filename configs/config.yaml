# Baseline experiment. Every effective setting is logged to MLflow.
experiment:
  name: div2k_baseline
  description: Residual autoencoder trained with reconstruction loss only
  seed: 0

data:
  root: ${oc.env:DIV2K_ROOT,.}
  train_dirs: [Datasets/DIV2K_train_HR]
  test_dir: Datasets/DIV2K_valid_HR
  expected_train_images: 800
  expected_test_images: 100
  validation_images: 20
  split_seed: 0
  crop_size: 256
  horizontal_flip: true
  # Decode training PNGs once into RAM (~6.7 GB for DIV2K); crops are identical either way.
  cache_images: false

model:
  name: residual_ae
  hidden_channels: 128
  latent_channels: 64
  downsampling_stages: 4
  negative_slope: 0.2

training:
  batch_size: 16
  max_steps: 5000
  optimizer: adam
  learning_rate: 0.0002
  scheduler: cosine
  warmup_steps: 250
  minimum_learning_rate: 0.000001
  gradient_clip: 1.0
  # Skip (do not apply) an update whose pre-clip gradient norm exceeds this; null disables.
  skip_update_grad_norm: null
  loss: mse
  resume_checkpoint: null
  early_stopping:
    enabled: true
    # Count validation checks, not optimizer steps.
    patience: 5
    # PSNR gain in dB must exceed this threshold to reset patience.
    min_delta: 0.01

validation:
  every_steps: 500
  crop_size: 512
  batch_size: 1
  checkpoint_metric: psnr
  checkpoint_mode: max

runtime:
  device: auto
  # float32, or bfloat16_mixed (training forward pass only; validation/evaluation stay float32).
  precision: float32
  cudnn_benchmark: false
  channels_last: false
  # torch.compile for the training forward pass only.
  compile: false
  num_workers: 4
  cpu_threads: 4

quantization:
  enabled: true
  scheme: uniform_symmetric_per_channel
  dtype: int8
  qmax: 127
  # Reuse this file for future matched A/B comparisons.
  calibration_file: null
  calibration_images: 20
  # null calibrates on whole images.
  calibration_crop_size: 256
  calibration_percentile: 99.9

serialization:
  format_version: 1
  float_dtype: float32
  layout: CHW
  byte_order: little

zstd:
  level: 3
  threads: 0
  checksum: true
  dictionary: null

evaluation:
  checkpoint: null
  source_run_id: null
  split: test
  max_images: null
  full_resolution: true
  padding_mode: replicate
  image_rounding: uint8
  png_compress_level: 6
  save_reconstructions: true
  save_latent_files: true
  # Test images shown as center-crop comparisons in plots/samples.png.
  plot_samples: 3

jpeg:
  # Reference codec measured on the same split by jpeg_reference.py.
  qualities: [5, 10, 15, 20, 30, 40, 50, 60, 70, 80, 90, 95]
  subsampling: "4:2:0"
  optimize: true
  # Evaluation summary.json files to place on the JPEG curve: {label: path}.
  compare: {}

tracking:
  uri: ${oc.env:MLFLOW_TRACKING_URI,sqlite:///mlflow.db}
  artifact_location: null
  experiment_name: zstd_autoencoder
  log_every_steps: 100
  # CPU/GPU utilisation and memory sampled by MLflow in the background.
  system_metrics: true
  # Training curves and reconstruction grids refresh at every validation.
  plots: true
  # Validation crops shown in plots/reconstructions/step_*.png.
  reconstruction_samples: 3

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S-%f}
  sweep:
    dir: multirun/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S-%f}
    subdir: ${hydra.job.num}
