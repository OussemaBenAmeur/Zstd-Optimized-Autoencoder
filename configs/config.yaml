# Baseline experiment. Every effective setting is logged to MLflow.
experiment:
  name: div2k_baseline
  description: Residual autoencoder trained with reconstruction loss only
  seed: 0

data:
  root: ${oc.env:DIV2K_ROOT,.}
  train_dirs: [DIV2K_train_HR, Datasets/DIV2K_train_HR]
  test_dir: Datasets/DIV2K_valid_HR
  expected_train_images: 800
  expected_test_images: 100
  validation_images: 20
  split_seed: 0
  crop_size: 256
  horizontal_flip: true

model:
  name: residual_ae
  hidden_channels: 128
  latent_channels: 64
  downsampling_stages: 4
  negative_slope: 0.2

training:
  batch_size: 16
  max_steps: 40000
  optimizer: adam
  learning_rate: 0.0002
  scheduler: cosine
  warmup_steps: 1000
  minimum_learning_rate: 0.000001
  gradient_clip: 1.0
  loss: mse
  resume_checkpoint: null

validation:
  every_steps: 2000
  crop_size: 512
  batch_size: 1
  checkpoint_metric: psnr
  checkpoint_mode: max

runtime:
  device: auto
  precision: float32
  num_workers: 4
  cpu_threads: 4

quantization:
  enabled: true
  scheme: uniform_symmetric_per_channel
  dtype: int8
  qmax: 127
  # Reuse this file for future matched A/B comparisons.
  calibration_file: null
  calibration_images: 20
  calibration_crop_size: 256
  calibration_percentile: 99.9

serialization:
  format_version: 1
  float_dtype: float32
  layout: CHW
  byte_order: little

zstd:
  level: 3
  threads: 0
  checksum: true
  dictionary: null

evaluation:
  checkpoint: null
  source_run_id: null
  split: test
  max_images: null
  full_resolution: true
  padding_mode: replicate
  image_rounding: uint8
  png_compress_level: 6
  save_reconstructions: true
  save_latent_files: true

tracking:
  uri: ${oc.env:MLFLOW_TRACKING_URI,sqlite:///mlflow.db}
  artifact_location: null
  experiment_name: zstd_autoencoder
  log_every_steps: 100

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S-%f}
  sweep:
    dir: multirun/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S-%f}
    subdir: ${hydra.job.num}
