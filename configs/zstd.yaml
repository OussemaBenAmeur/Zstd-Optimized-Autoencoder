# Same model, split, crop stream, optimizer and runtime/budget as baseline v3.
defaults:
  - baseline_v3
  - _self_

experiment:
  name: div2k_zstd
  description: Baseline v3 with reconstruction MSE plus actual Zstd-compressed latent size

training:
  loss: mse_zstd
  zstd_loss:
    # Actual int8 + Zstd file bits per input pixel. Decoder latents stay continuous.
    lambda_rate: 0.001
    # Reference scales apply only inside the loss, never inside the model forward pass.
    calibration_file: results/baseline_v3/evaluation/quantization.json
    qmax: ${quantization.qmax}
    codec: ${zstd}
    # Two-point Gaussian smoothing in quantized-symbol units; K paired probes.
    perturbation_symbols: 1.0
    directions: 4
