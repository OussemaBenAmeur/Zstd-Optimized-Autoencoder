# Pipeline verification only. These weights are not scientific results.
defaults:
  - config
  - _self_

experiment:
  name: smoke
  description: Two-step pipeline verification; not a trained baseline
model:
  hidden_channels: 8
  latent_channels: 4
data:
  crop_size: 32
training:
  batch_size: 1
  max_steps: 2
  warmup_steps: 0
validation:
  every_steps: 1
  crop_size: 32
runtime:
  device: cpu
  num_workers: 0
  cpu_threads: 2
quantization:
  calibration_images: 2
  calibration_crop_size: 32
evaluation:
  split: validation
  max_images: 2
  # Smoke inference uses a fixed crop, never a full-resolution benchmark.
  full_resolution: false
tracking:
  log_every_steps: 1
